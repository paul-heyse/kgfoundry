interfaces:
  download-cli:
    module: download.cli
    owner: kgfoundry
    entrypoint: download.cli:app
    description: CLI interface for download workflows.
    operations:
      harvest:
        operation_id: cli.download.harvest
        summary: Harvest documents from OpenAlex

  orchestration-cli:
    module: orchestration.cli
    owner: kgfoundry
